name: Build Wish Board APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'wish-board-android-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip -q wish-board-android-source.zip -d extracted
          test -f extracted/wishboard-work/android/app/build.gradle.kts

      - name: Build APK
        working-directory: extracted/wishboard-work/android
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: wish-board-apk
          path: extracted/wishboard-work/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
